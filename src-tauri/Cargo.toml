[package]
name = "sheer"
version = "1.0.0"
description = "Sheer, a local-only desktop PDF app"
authors = ["Sheer contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "sheer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# No cargo features on purpose (SECURITY T4/T5): `devtools` would enable the web inspector in release builds,
# `protocol-asset` the asset protocol. `tests/security_baseline.rs` fails if either appears.
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
# Opens the one link the user confirmed (commands/links.rs). The plugin is not registered with the builder and no capability names
# it: only its `open_url` function is called, from Rust, with a URL that `security::links` classified (SECURITY P3).
tauri-plugin-opener = "2.7.0"
# Dynamic binding only (PDFium is bundled as a resource and bound at runtime). `image_api` and `thread_safe`
# stay off: PNG encoding uses the `png` crate and every PDFium call lives on one worker thread.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wipes the password of an encrypted PDF from memory when it is dropped (SECURITY D3). MIT OR Apache-2.0; no further dependencies.
zeroize = "1"
lopdf = { version = "0.45.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Glyph outlines of the bundled signature font (signatures/typed.rs only). MIT OR Apache-2.0, googlefonts/fontations, forbid(unsafe_code).
skrifa = "0.48"
flate2 = "1"
# The OS region (BCP 47 locale name) for the paper default A4 or Letter (platform::paper_default); the Win32 and CoreFoundation calls need unsafe, which our code forbids. MIT OR Apache-2.0.
sys-locale = "0.3"
# Signature library (ADR-041 section 7, storage/{keychain,signatures}.rs). XChaCha20-Poly1305 (Apache-2.0 OR MIT, RustCrypto); random key
# and nonces from getrandom (MIT OR Apache-2.0); the OS credential store sits behind keyring-core (MIT OR Apache-2.0).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.3"
# SASLprep (RFC 4013) for the passwords of AES-256 R6 (security/secret.rs); the same crate and version lopdf uses. MIT OR Apache-2.0.
stringprep = "0.1"
keyring-core = "1.0"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
minisign-verify = "0.2"
base64 = "0.22"

# Windows only: opening another PDF from the file manager starts another process; this hands its command line to the running
# window and ends it (src/sources.rs). Local only (a named mutex and a window message): no network. macOS routes files to the
# running app by itself, so it is not built there.
[target.'cfg(windows)'.dependencies]
# The identity of an open file (volume serial number + file index) for intake's "is the canonical path still the file I opened"
# check, which `std` offers on Unix only (`MetadataExt::ino`) without `unsafe`. Unlicense OR MIT; already in the build via walkdir.
same-file = "1.0.6"
# Credential Manager store for keyring-core (MIT OR Apache-2.0); holds the signature library key (storage/keychain.rs).
windows-native-keyring-store = "1.1"
tauri-plugin-single-instance = "2.5.2"

# macOS only: the "Reduce transparency" accessibility flag (src/platform/macos.rs). Already part of the build through
# Tauri/wry; only the two features used are enabled here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
# Keychain store for keyring-core (MIT OR Apache-2.0); holds the signature library key (storage/keychain.rs).
apple-native-keyring-store = { version = "1.0", default-features = false, features = ["keychain"] }

# Unix only: `O_NONBLOCK` and `O_NOCTTY` for opening the settings file without waiting on a FIFO (src/storage/settings.rs).
# Already part of the build through Tauri; no features.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tests only: the macOS menu's accelerators (src/actions/menu.json) are parsed by muda, the crate under Tauri's menus, and a
# string it cannot read is dropped without an error; a test parses each one. Already in the build through Tauri (same version).
[dev-dependencies]
minisign = { version = "0.10", default-features = false }
muda = { version = "0.20.0", default-features = false }

# The engine contains panics with `catch_unwind` (SECURITY P5), which only works when panics unwind.
# `panic = "abort"` is therefore forbidden; `tests/security_baseline.rs` checks this.
[profile.release]
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
