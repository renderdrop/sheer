# cargo-deny policy. Rule 2 of ORCHESTRATOR_PROMPT: permissive licenses only.
# Run from src-tauri/: cargo deny --manifest-path src-tauri/Cargo.toml check --config deny.toml

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities are always errors in v2; additionally deny unmaintained/unsound/yanked crates.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive allowlist. Entries beyond the six named in rule 2 are documented in ADR-000.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

[licenses.private]
# Our own (unpublished, AGPL) workspace crates are not dependencies.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
