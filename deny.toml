# cargo-deny policy. Rule 2 of ORCHESTRATOR_PROMPT: permissive licenses only.
# Run from src-tauri/: cargo deny --manifest-path src-tauri/Cargo.toml check --config deny.toml

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities are always errors in v2; additionally deny unmaintained/unsound/yanked crates.
unmaintained = "all"
unsound = "all"
yanked = "deny"
# RUSTSEC-2023-0071 (rsa, Marvin timing side channel, no fixed release in any line): Sheer never decrypts with RSA; the private key signs locally on an explicit user action with no network timing oracle; the default key is ECDSA P-256 (ADR-121 section 2, SECURITY R14).
ignore = [{ id = "RUSTSEC-2023-0071", reason = "ADR-121 section 2, SECURITY R14: no RSA decryption, local signing only" }]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive allowlist. Entries beyond the six named in rule 2 are documented in ADR-000. Only licenses a shipped target uses are listed
# (an allowance nobody uses is a hole for later): add BSD-2-Clause, BSL-1.0 or Apache-2.0 WITH LLVM-exception back when a dependency needs one.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
]

# OFL-1.1 is allowed for bundled font files only (Inter, typed signature fonts; ADR-059, ADR-100), never for crates: it is deliberately not in the list above.

[licenses.private]
# Our own (unpublished, AGPL) workspace crates are not dependencies.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
