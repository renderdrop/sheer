name: Release

# Builds UNSIGNED installers for a version tag and attaches them to a GitHub Release (ADR-031).
# Never creates, moves or pushes tags: it only builds a tag that already exists.
#   - push of a `v*` tag: builds that tag.
#   - workflow_dispatch with `tag`: builds an existing tag after the fact (e.g. v0.4.0).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.4.0'
        required: true
        type: string

# No signing secrets, no updater keys. Read-only token everywhere except the publish job.
permissions:
  contents: read

# One run per tag; a newer run for the same tag waits instead of cancelling a half-finished release. Independent of CI.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: the runner's architecture (arm64 on macos-latest), not universal, because the pinned PDFium
          # binary is fetched for the runner architecture only. Intel Macs are not covered by this build.
          - os: windows-latest
            bundle: nsis
            glob: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: dmg
            glob: src-tauri/target/release/bundle/dmg/*.dmg
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Put Git Bash first on PATH
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install npm dependencies
        run: npm ci

      # Pinned release, SHA256-verified (scripts/fetch-pdfium.sh).
      - name: Fetch PDFium
        run: npm run fetch-pdfium

      - name: Build unsigned installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Checksum
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp ${{ matrix.glob }} dist-release/
          cd dist-release
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
          ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      # The workflow's own commit: scripts/changelog-section.sh may not exist in an old tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag being released: only its CHANGELOG.md is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: tag-src
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $RELEASE_TAG" >&2; exit 1; }

          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -- *.sha256
          cd ..

          {
            echo "> **Unsigned installers.** These builds are not code-signed or notarized, so Windows SmartScreen and macOS Gatekeeper"
            echo "> will warn on first start. Verify the download against \`SHA256SUMS.txt\`."
            echo "> Why and what is needed to sign: [docs/BLOCKERS.md (B-002)](https://github.com/${GH_REPO}/blob/${RELEASE_TAG}/docs/BLOCKERS.md)."
            echo
            CHANGELOG_FILE=tag-src/CHANGELOG.md bash scripts/changelog-section.sh "$version" | tail -n +2
          } > notes.md

          flags=()
          # Versions before 1.0 are pre-releases.
          if [[ "$version" == 0.* ]]; then flags+=(--prerelease); fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Sheer $version" --notes-file notes.md "${flags[@]}"
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            # --verify-tag: fail instead of creating a tag that does not exist.
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "Sheer $version" --notes-file notes.md "${flags[@]}"
          fi
