name: Release

# Builds UNSIGNED installers for a version tag and attaches them to a GitHub Release (ADR-031).
# Never creates, moves or pushes tags: it only builds a tag that already exists.
#   - push of a `v*` tag: builds that tag.
#   - workflow_dispatch with `tag`: builds an existing tag after the fact (e.g. v0.4.0).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.4.0'
        required: true
        type: string

# Installer signing secrets: none. The updater key (TAURI_SIGNING_PRIVATE_KEY) is optional and used only by the build step. Read-only token everywhere except the publish job.
permissions:
  contents: read

# One run per tag; a newer run for the same tag waits instead of cancelling a half-finished release. Independent of CI.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS per-user installer; the WebView2 bootstrapper and the .pdf "Open with" hooks are in
          # tauri.windows.conf.json (ADR-053 section 5).
          - os: windows-latest
            bundle: nsis
            target_args: ''
            pdfium: win-x64
            glob: src-tauri/target/release/bundle/nsis/*.exe
            updater_glob: src-tauri/target/release/bundle/nsis/*.exe.sig
          # macOS: one universal DMG (arm64 + x86_64). fetch-pdfium.sh mac-universal fetches both PDFium slices.
          - os: macos-latest
            bundle: dmg
            target_args: --target universal-apple-darwin
            pdfium: mac-universal
            glob: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            updater_glob: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Put Git Bash first on PATH
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Add the second macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install npm dependencies
        run: npm ci

      # Pinned release, SHA256-verified (scripts/fetch-pdfium.sh).
      - name: Fetch PDFium
        run: bash scripts/fetch-pdfium.sh "${{ matrix.pdfium }}"

      # ADR-137: the OCR sidecar (universal, ad-hoc signed) must exist as src-tauri/binaries/sheer-ocr-<triple> before tauri build
      # (Tauri externalBin, tauri.macos.conf.json); Tauri signs it with the app's identity when one is configured.
      - name: Build the OCR sidecar
        if: runner.os == 'macOS'
        run: bash scripts/build-sidecar-macos.sh

      # Updater artifacts (the macOS .app.tar.gz, the NSIS .sig) only when the repository secret TAURI_SIGNING_PRIVATE_KEY exists
      # (ADR-053 section 3). The expression below yields only "true" or "false": the secret itself is never echoed or logged.
      # Without it the release is as before: unsigned installers, no latest.json. The alternative is `scripts/sign-update.sh` locally.
      - name: Build installer
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundles="${{ matrix.bundle }}"
          args=()
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
            if [ "$RUNNER_OS" = "macOS" ]; then bundles="app,dmg"; fi
          fi
          npm run tauri build -- --bundles "$bundles" ${{ matrix.target_args }} ${args[@]+"${args[@]}"}

      - name: Checksum
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp ${{ matrix.glob }} dist-release/
          # Updater packages and signatures exist only when the signing secret was set.
          for u in ${{ matrix.updater_glob }}; do [ -e "$u" ] && cp "$u" dist-release/ || true; done
          cd dist-release
          for f in *; do
            case "$f" in *.sha256|*.sig) continue ;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      # The workflow's own commit: scripts/changelog-section.sh may not exist in an old tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag being released: only its CHANGELOG.md is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: tag-src
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $RELEASE_TAG" >&2; exit 1; }

          cd artifacts
          # latest.json only when signed packages (with .sig files) were built.
          if ls *.sig >/dev/null 2>&1; then node ../scripts/latest-json.mjs . "$version"; fi
          cat *.sha256 > SHA256SUMS.txt
          rm -- *.sha256
          cd ..

          {
            echo "## sheer. ${version}"
            echo
            echo "> **Unsigned installers.** These builds are not code-signed or notarized, so Windows SmartScreen and macOS Gatekeeper"
            echo "> will warn on first start. Verify the download against \`SHA256SUMS.txt\`."
            echo "> Why and what is needed to sign: [docs/BLOCKERS.md (B-002)](https://github.com/${GH_REPO}/blob/${RELEASE_TAG}/docs/BLOCKERS.md)."
            echo
            CHANGELOG_FILE=tag-src/CHANGELOG.md bash scripts/changelog-section.sh "$version" | tail -n +2
          } > notes.md

          flags=()
          # Versions before 1.0 and SemVer pre-releases (1.2.0-beta.1) are pre-releases, so GitHub never marks them "Latest".
          if [[ "$version" == 0.* || "$version" == *-* ]]; then flags+=(--prerelease); fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "sheer. $version" --notes-file notes.md "${flags[@]}"
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            # --verify-tag: fail instead of creating a tag that does not exist.
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "sheer. $version" --notes-file notes.md "${flags[@]}"
          fi
