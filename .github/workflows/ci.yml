name: CI

# ADR-046 (public repository): every push to main and every pull request runs the checks (Linux job) and the Rust build + tests (Windows, macOS) and
# skips docs-only changes (ADR-123: split so that each job targets 15 minutes; the timeouts of 20 / 25 minutes are the hard stop). Tag pushes run only release.yml. The unsigned debug bundles are built on a manual start only.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# No secrets, no signing, read-only token. Signed release builds are a separate, manual process.
permissions:
  contents: read

# ADR-045: a manual start has its own group, so a push to the same ref no longer cancels it (and it no longer cancels the push run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  # ADR-052: runs on main are never cancelled (every commit gets a finished result in all jobs); pull requests and manual
  # runs still cancel their own older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Manual start: the debug bundles on top of the checks.
  FULL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # ADR-123: the platform-independent gates run once, on Linux (no Rust compile: cargo tree/deny/audit only resolve the lockfile).
  web:
    name: web checks (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Minimal toolchain (no clippy/rustfmt: this job only resolves the lockfile). rust-toolchain.toml lists those components, so
      # the channel is read from it, installed explicitly, and selected through RUSTUP_TOOLCHAIN (which overrides the file).
      - name: Install Rust toolchain (minimal)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      # Exact versions (the ones `npm run check` is developed against), so a new release cannot change the gate
      # between two CI runs. Bump together with the local install.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check (web part)
        run: SHEER_CHECK_PART=web npm run check

  native:
    name: rust${{ github.event_name == 'workflow_dispatch' && ' + debug build' || '' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `npm run` starts scripts through cmd.exe on Windows, where `bash` could resolve to the WSL launcher.
      - name: Put Git Bash first on PATH
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"

      # Node is only needed for the manual debug bundle (the frontend build); the Rust gates do not use it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.FULL_RUN == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs exactly what rust-toolchain.toml pins (channel, profile, components).
      - name: Install Rust toolchain
        run: rustup toolchain install

      # Dependencies only (rust-cache drops the workspace's own artifacts before saving), and saved on main only: a pull request
      # restores but never writes (ADR-123).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The pinned PDFium binary (the script re-verifies its SHA256 against the pin before using a cached copy).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-pdfium.sh') }}

      - name: Install npm dependencies
        if: env.FULL_RUN == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # Pinned release, SHA256-verified (scripts/fetch-pdfium.sh). Never downloaded at runtime.
      - name: Check (Rust part - PDFium fetch, fmt, clippy, test)
        run: SHEER_CHECK_PART=rust bash scripts/check.sh

      # ADR-107: the signature library key against the real OS store (Windows Credential Manager, macOS Keychain on the runner), under
      # unique service names that the tests remove again. A keychain that cannot be reached on a runner fails the job on purpose.
      - name: Real credential store round trip
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo test --lib -- --ignored platform_store_round_trip real_keychain_library_survives_a_restart

      - name: Build debug bundles (unsigned)
        if: env.FULL_RUN == 'true'
        run: npm run tauri -- build --debug

      # The name says it on purpose: these are unsigned debug builds (devtools on, no notarization, no code signing) for
      # looking at a manual run. They are not releases and must never be handed to users. Releases come from
      # release.yml.
      - name: Upload bundles
        if: env.FULL_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sheer-${{ runner.os }}-${{ runner.arch }}-debug-not-for-distribution
          path: |
            src-tauri/target/debug/bundle/dmg/*.dmg
            src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
