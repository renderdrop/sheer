name: CI

# ADR-043: CI minutes are scarce and macOS runners count ten times. A push to main runs Windows only (checks + tests, no
# bundles) and skips docs-only changes; macOS (and the debug bundles) run only on a tag push and on a manual start.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# No secrets, no signing, read-only token. Signed release builds are a separate, manual process.
permissions:
  contents: read

# ADR-045: a manual start has its own group, so a push to the same ref no longer cancels it (and it no longer cancels the push run).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Tag push or manual start: both platforms and the debug bundles. Everything else: Windows checks + tests only.
  FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: check${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && ' + debug build' || '' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `npm run` starts scripts through cmd.exe on Windows, where `bash` could resolve to the WSL launcher.
      - name: Put Git Bash first on PATH
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs exactly what rust-toolchain.toml pins (channel, profile, components).
      - name: Install Rust toolchain
        run: rustup toolchain install

      # Exact versions (the ones `npm run check` is developed against), so a new release cannot change the gate
      # between two CI runs. Bump together with the local install.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      # The pinned PDFium binary (the script re-verifies its SHA256 against the pin before using a cached copy).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-pdfium.sh') }}

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Pinned release, SHA256-verified (scripts/fetch-pdfium.sh). Never downloaded at runtime.
      - name: Fetch PDFium
        run: npm run fetch-pdfium

      - name: Check
        run: npm run check

      - name: Build debug bundles (unsigned)
        if: env.FULL_RUN == 'true'
        run: npm run tauri -- build --debug

      # The name says it on purpose: these are unsigned debug builds (devtools on, no notarization, no code signing) for
      # looking at a tag or a manual run. They are not releases and must never be handed to users. Releases come from
      # release.yml.
      - name: Upload bundles
        if: env.FULL_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sheer-${{ runner.os }}-${{ runner.arch }}-debug-not-for-distribution
          path: |
            src-tauri/target/debug/bundle/dmg/*.dmg
            src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
