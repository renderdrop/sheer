# Dependency updates (ORCHESTRATOR_PROMPT 13.5, FEEDBACK F6): security updates, plus one grouped PR per ecosystem
# for patch/minor version updates. Major bumps are ignored (they need a deliberate migration and an ADR).
# Every update still has to pass `npm run check` (licenses, advisories, sources) in CI on Windows and macOS.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-patch-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # The ESLint workspace keeps its own TypeScript 6 for typescript-eslint (see tools/lint/config.js).
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      lint-security:
        applies-to: security-updates
        patterns: ['*']
      lint-patch-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # For 0.x crates a minor bump is breaking (Cargo semver), so only patch updates are grouped for them;
  # Dependabot classifies 0.x minor bumps as minor, hence the extra ignore for the Tauri-family 0.x crates.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
      cargo-patch-minor:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'muda'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
